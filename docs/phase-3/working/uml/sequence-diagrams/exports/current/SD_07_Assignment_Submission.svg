eceipt details</text><line x1="390" y1="1330" x2="150" y2="1330" stroke="#8A8A7A" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="125.0" y="1299" width="290" height="25" rx="6" fill="#FFF9F2" opacity="0.96"/><text x="270.0" y="1317" text-anchor="middle" font-family="Arial" font-size="16" fill="#503724">Display receipt code, version, and timestamp</text>
