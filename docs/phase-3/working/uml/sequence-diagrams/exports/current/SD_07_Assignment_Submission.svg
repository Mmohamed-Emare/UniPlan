 and MAX(version_number)</text><line x1="1590" y1="610" x2="1350" y2="610" stroke="#8A8A7A" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="1325.0" y="579" width="290" height="25" rx="6" fill="#FFF9F2" opacity="0.96"/><text x="1470.0" y="597" text-anchor="middle" font-family="Arial" font-size="16" fill="#503724">Return due date, file rules, latest version</text><line x1="1350" y1="680" x2="870" y2="680" stroke="#8A8A7A" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="965.0" y="649" width="290" height="25" rx="6" fill="#FFF9F2" opacity="0.96"/><text x="1110.0" y="667" text-anchor="middle" font-family="Arial" font-size="16" fill="#503724">Return policy and version state</text><path d="M 870 735 h 85 v 42 h -68" fill="none" stroke="#7A4D2D" stroke-width="2.5" marker-end="url(#arrow)"/><text x="985" y="760" font-family="Arial" font-size="15" fill="#503724">Validate deadline, detected type, file size, and resubmission rule</text><rect x="545" y="820" width="845" height="115" rx="10" fill="#FFF8EE" fill-opacity="0.6" stroke="#C48A3E" stroke-width="2" stroke-dasharray="8 5"/><text x="565" y="846" font-family="Arial" font-size="16" font-weight="bold" fill="#9A5B22">alt — validation result</text><text x="575" y="878" font-family="Arial" font-size="16" fill="#8B4A28">[Invalid / late / resubmission disabled] → return validation error; no receipt and no accepted-version row</text><text x="575" y="910" font-family="Arial" font-size="16" fill="#47613C">[Valid] → continue with file storage and a new immutable version</text><line x1="870" y1="980" x2="1110" y2="980" stroke="#7A4D2D" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="845.0" y="949" width="290" height="25" rx="6" fill="#FFF9F2" opacity="0.96"/><text x="990.0" y="967" text-anchor="middle" font-family="Arial" font-size="16" fill="#503724">Store file using a safe server-generated name</text><line x1="1110" y1="1030" x2="870" y2="1030" stroke="#8A8A7A" stroke-w